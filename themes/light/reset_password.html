{{define "reset_password.html"}}
{{template "head" .Head}}
	<main id="main" class="site-main login">
		<h1>Reset password</h1>
		{{if .Invalid}}
			<p>This reset link is invalid, expired, or has already been used.</p>
			<p><a href="/forgot-password">Request a new one</a></p>
		{{else}}
			{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
			<form method="post" action="/reset-password">
				<input type="hidden" name="token" value="{{.Token}}">
				<label>New password <input type="password" name="new_password" autocomplete="new-password" required></label>
				<label>Confirm new password <input type="password" name="confirm_password" autocomplete="new-password" required></label>
				<button type="submit">Reset password</button>
			</form>
		{{end}}
	</main>
{{template "foot" .}}
{{end}}
